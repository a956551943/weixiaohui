<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#9f1239" />
  <title>订婚准备清单</title>
  <style>
    :root {
      --bg: #faf6f4;
      --card: #fff;
      --primary: #be123c;
      --primary-dark: #9f1239;
      --text: #1e293b;
      --muted: #64748b;
      --border: #f3e4e4;
      --radius: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: calc(68px + var(--safe-bottom));
    }
    header {
      background: linear-gradient(135deg, #9f1239, #e11d48);
      color: #fff;
      padding: 16px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(159, 18, 57, .18);
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header .meta { font-size: 12px; opacity: .92; margin-top: 4px; }
    .progress-bar {
      margin-top: 10px;
      background: rgba(255,255,255,.25);
      border-radius: 99px;
      height: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #fde68a;
      width: 0%;
      transition: width .3s;
    }
    .progress-text { font-size: 11px; margin-top: 4px; opacity: .92; }
    .sync-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #fecdd3; flex-shrink: 0; }
    .sync-dot.on { background: #86efac; }
    .sync-dot.busy { background: #fde68a; }
    .sync-dot.off { background: #fecdd3; }
    .btn-share {
      margin-left: auto;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.45);
      color: #fff;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      cursor: pointer;
    }
    main { padding: 10px; max-width: 640px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .card h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--primary-dark);
      margin-bottom: 2px;
    }
    .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
    .card h2 .status { margin-left: auto; }
    .card h2 .status + .count { margin-left: 0; }
    .count.complete { color: #15803d; }
    .section-title-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .section-title-input:focus { outline: none; }
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      border-top: 1px solid #f8eeee;
    }
    .item-main { flex: 1; min-width: 0; }
    .item-title, .title-input {
      width: 100%;
      min-width: 0;
      font-size: 14px;
    }
    .item.done .item-title,
    .item.done .title-input { color: #64748b; }
    .item.cancel .item-title,
    .item.cancel .title-input { color: #94a3b8; text-decoration: line-through; }
    .item.has-flow { align-items: flex-start; }
    .item.has-flow .status,
    .item.has-flow .btn-text { margin-top: 8px; }
    .flow { margin: 2px 0 8px; }
    .flow-step {
      display: grid;
      grid-template-columns: 44px 16px minmax(0, 1fr);
      column-gap: 8px;
    }
    .flow-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-align: right;
      padding-top: 1px;
    }
    .flow-rail { position: relative; }
    .flow-rail::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 14px;
      bottom: -2px;
      width: 2px;
      background: #fecdd3;
    }
    .flow-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--primary);
      position: relative;
      z-index: 1;
    }
    .flow-name { font-size: 14px; font-weight: 600; }
    .flow-desc { font-size: 12px; color: var(--muted); margin: 2px 0 12px; }
    .flow-step:last-child .flow-rail::before { display: none; }
    .carry {
      background: #fff7ed;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 4px;
    }
    .carry-title { font-size: 12px; font-weight: 700; color: #9a3412; margin-bottom: 6px; }
    .carry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .carry-card { background: #fff; border-radius: 8px; padding: 6px 8px; }
    .carry-who { font-size: 13px; font-weight: 700; }
    .carry-what { font-size: 12px; color: #9a3412; line-height: 1.4; }
    .detail-input {
      width: 100%;
      margin: 0 0 6px;
      border: none;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 12px;
      line-height: 1.5;
      padding: 6px 8px;
      resize: vertical;
      min-height: 88px;
    }
    .title-input, .field-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      -webkit-appearance: none;
    }
    .title-input { border: none; background: transparent; padding: 6px 0; }
    .title-input:focus, .field-input:focus { outline: none; }
    .field-input:focus { border-color: var(--primary); }
    .status {
      flex: 0 0 84px;
      border: none;
      border-radius: 99px;
      padding: 4px 6px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    .status.done { background: #dcfce7; color: #15803d; }
    .status.todo { background: #f1f5f9; color: #475569; }
    .status.pending { background: #ffedd5; color: #c2410c; }
    .status.cancel { background: #f1f5f9; color: #94a3b8; }
    .btn-text {
      border: none;
      background: none;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }
    .empty-section { font-size: 13px; color: var(--muted); padding: 8px 0 4px; }
    .composer-label { font-size: 13px; font-weight: 600; margin: 10px 0 6px; }
    .composer-label:first-of-type { margin-top: 4px; }
    .new-section-row, .add-form { display: grid; gap: 8px; }
    .new-section-row { grid-template-columns: minmax(0, 1fr) auto; }
    .add-form { grid-template-columns: minmax(0, 1fr) 120px auto; }
    .add-form select, .field-input {
      font-size: 13px;
    }
    .add-form select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    .new-section-row button, .add-form button, .fab-bar button {
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .new-section-row button, .add-form button {
      padding: 7px 12px;
      background: #fff1f2;
      color: var(--primary-dark);
      white-space: nowrap;
    }
    @media (max-width: 560px) {
      .new-section-row, .add-form { grid-template-columns: 1fr; }
    }
    .fab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(8px + var(--safe-bottom));
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .fab-bar button { flex: 0 0 auto; padding: 10px 12px; }
    .btn-save { flex: 1; background: var(--primary); color: #fff; }
    .btn-ghost { background: #f1f5f9; color: var(--muted); }
    .toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1e293b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      opacity: 0;
      transition: all .3s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .file-input { display: none; }
  </style>
</head>
<body>
<header>
  <h1>订婚准备清单</h1>
  <div class="meta">10月10日晚入住 · 10月11日中午酒席</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">已完成 0</div>
  <div class="sync-bar">
    <span class="sync-dot off" id="syncDot"></span>
    <span id="syncLabel">连接中…</span>
    <button class="btn-share" id="btnShare" type="button">分享链接</button>
  </div>
</header>

<main>
  <div class="card" id="composer">
    <h2>新增</h2>
    <div class="composer-label">事项类别</div>
    <div class="new-section-row">
      <input class="field-input" id="newSectionTitle" type="text" maxlength="30" placeholder="例如：交通、化妆" autocomplete="off" />
      <button type="button" id="btnAddSection">添加分类</button>
    </div>
    <div class="composer-label">事项名称</div>
    <div class="add-form">
      <input class="field-input" id="newItemTitle" type="text" maxlength="80" placeholder="例如：喜糖" autocomplete="off" />
      <select id="newItemSection" aria-label="选择分类"></select>
      <button type="button" id="btnAddItem">添加条目</button>
    </div>
  </div>
  <div id="list"></div>
</main>

<div class="fab-bar">
  <button type="button" class="btn-ghost" id="btnExport">导出</button>
  <button type="button" class="btn-ghost" id="btnImport">导入</button>
  <button type="button" class="btn-ghost" id="btnReset">重置</button>
  <button type="button" class="btn-save" id="btnSave">已自动保存</button>
</div>
<input class="file-input" id="importFile" type="file" accept="application/json,.json" />
<div class="toast" id="toast">已保存</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SYNC = window.TRIP_SYNC || { enabled: false, defaultRoom: 'engagement-wxh' };
const ROOM_ID = new URLSearchParams(location.search).get('room') || SYNC.defaultRoom || 'engagement-wxh';
const STORAGE_KEY = 'engagement_plan_v1_' + ROOM_ID;
const STATUSES = ['已完成', '未完成', '待定', '已取消'];
const CONTENT_VERSION = 4;
const FLOW_DETAIL = '男方7.30左右从酒店出发去男方家里，到门口放礼炮、鞭炮，然后进门喝茶、给聘金放礼品，闲聊一会后出发酒店准备拍照吃饭等。男主拿着聘金，聘金放在红色盘子里。鞭炮姐夫来放，茅台和红酒妈妈拿、香烟外甥女拿、红枣桂圆莲子花生粉丝姐姐拿、彩礼箱外甥和姐夫各拿一个（打开）。';

const SEED = [
  { id: 'gift', title: '聘礼', items: [
    ['彩礼箱', '已完成'], ['彩礼银行卡', '已完成'], ['中华烟 2条', '已完成'], ['红酒 2瓶', '已完成'],
    ['花生 2斤', '已完成'], ['桂圆 2斤', '已完成'], ['红枣 2斤', '已完成'], ['茅台 2瓶', '已完成'],
    ['聘金 八万八千八百八十八', '未完成'], ['粉丝6包 1斤1包', '未完成'], ['莲子 2斤', '未完成'], ['猪脚 2只', '已取消'],
  ]},
  { id: 'meal', title: '用餐', items: [
    ['酒席 10.11 日中午', '已完成'], ['中华烟 4条（40包）', '已完成'], ['红酒 1箱（6瓶）', '已完成'], ['饮料', '待定'],
    ['喜糖 50盒', '已完成'],
  ]},
  { id: 'stay', title: '住宿', items: [
    ['10.10 日晚 天台友力大厦酒店（4个标间）', '已完成'],
  ]},
  { id: 'wear-male', title: '着装 · 男方', items: [
    ['男主', '已完成'], ['母亲', '已完成'], ['姐姐', '已完成'], ['外甥', '已完成'], ['外甥女', '已完成'], ['姐夫', '已完成'],
  ]},
  { id: 'wear-female', title: '着装 · 女方', items: [
    ['女主', '已完成'], ['母亲', '已完成'], ['弟弟', '已完成'], ['父亲', '未完成'],
  ]},
  { id: 'scene', title: '其他', items: [
    ['鞭炮', '待定'], ['染红色鸡蛋', '未完成'],
  ]},
  { id: 'flow', title: '现场流程', items: [
    ['现场流程', '待定'],
  ]},
];

let state = defaultState();
let toastTimer = null;

function uid() {
  return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function defaultState() {
  const data = {
    version: CONTENT_VERSION,
    sections: SEED.map(sec => ({
      id: sec.id,
      title: sec.title,
      custom: false,
      items: sec.items.map((item, index) => ({
        id: sec.id + '_' + index,
        title: item[0],
        status: item[1],
        custom: false,
      })),
    })),
  };
  const flow = data.sections.find(section => section.id === 'flow').items[0];
  flow.detail = FLOW_DETAIL;
  return data;
}

function ensureItem(section, id, title, status) {
  if (section.items.some(item => item.title === title || (item.title || '').startsWith(title))) return;
  section.items.push({ id, title, status, custom: true });
}

function upgradeState(data) {
  if ((data.version || 1) >= CONTENT_VERSION) return false;
  const gift = (data.sections || []).find(section => section.id === 'gift');
  if (gift) {
    gift.items.forEach(item => {
      if (item.title === '粉丝') item.title = '粉丝6包 1斤1包';
      if (item.title === '聘金 8万' || item.title === '聘金') item.title = '聘金 八万八千八百八十八';
      if ((item.title || '').startsWith('猪脚')) item.status = '已取消';
    });
    ensureItem(gift, 'gift_lotus', '莲子 2斤', '未完成');
  }
  const meal = (data.sections || []).find(section => section.id === 'meal');
  if (meal) ensureItem(meal, 'meal_candy', '喜糖 50盒', '已完成');
  const male = (data.sections || []).find(section => section.id === 'wear-male');
  if (male) ensureItem(male, 'wear_male_jiefu', '姐夫', '已完成');
  const scene = (data.sections || []).find(section => section.id === 'scene');
  if (scene) {
    if (scene.title === '现场与其他') scene.title = '其他';
    ensureItem(scene, 'scene_eggs', '染红色鸡蛋', '未完成');
  }
  let flowItem = null;
  (data.sections || []).forEach(section => {
    if (section.id === 'flow') return;
    const index = (section.items || []).findIndex(item => item.title === '现场流程' || (item.title || '').startsWith('现场流程'));
    if (index < 0) return;
    flowItem = section.items.splice(index, 1)[0];
  });
  let flowSection = (data.sections || []).find(section => section.id === 'flow');
  if (!flowSection) {
    flowSection = { id: 'flow', title: '现场流程', custom: false, items: [] };
    data.sections.push(flowSection);
  }
  const flowIndex = data.sections.indexOf(flowSection);
  if (flowIndex !== data.sections.length - 1) {
    data.sections.splice(flowIndex, 1);
    data.sections.push(flowSection);
  }
  if (!flowSection.title) flowSection.title = '现场流程';
  if (flowItem) {
    flowItem.title = '现场流程';
    if (!flowItem.detail) flowItem.detail = FLOW_DETAIL;
    flowSection.items = flowSection.items.filter(item => item.id !== flowItem.id && item.title !== '现场流程');
    flowSection.items.unshift(flowItem);
  }
  if (!flowSection.items.some(item => item.title === '现场流程')) {
    flowSection.items.unshift({ id: 'flow_0', title: '现场流程', status: '待定', custom: false, detail: FLOW_DETAIL });
  }
  data.version = CONTENT_VERSION;
  return true;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function resolveStatus(item) {
  if (STATUSES.includes(item.status)) return item.status;
  if (item.flag === '待定' || item.flag === '待确认') return '待定';
  return item.done ? '已完成' : '未完成';
}

function normalizeState(data) {
  let changed = false;
  (data.sections || []).forEach(section => {
    (section.items || []).forEach(item => {
      const status = resolveStatus(item);
      if (item.status !== status || 'done' in item || 'flag' in item || 'note' in item) {
        item.status = status;
        delete item.done;
        delete item.flag;
        delete item.note;
        changed = true;
      }
    });
  });
  return changed;
}

function statusClass(status) {
  if (status === '已完成') return 'done';
  if (status === '待定') return 'pending';
  if (status === '已取消') return 'cancel';
  return 'todo';
}

function statusOptions(current) {
  return STATUSES.map(status =>
    '<option value="' + status + '"' + (status === current ? ' selected' : '') + '>' + status + '</option>'
  ).join('');
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('engagement_plan_v1');
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.sections)) return null;
    return data;
  } catch (_) {
    return null;
  }
}

function findItem(id) {
  for (const section of state.sections) {
    const item = section.items.find(entry => entry.id === id);
    if (item) return { section, item };
  }
  return null;
}

function allItems() {
  return state.sections.flatMap(section => section.items);
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

function persist() {
  localVersion += 1;
  const version = localVersion;
  rememberLocal();
  if (applyingRemote) return;
  if (getSyncEnabled()) {
    setSyncUI('busy', '同步中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => pushRemote(version), 400);
    return;
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => showToast('已保存在本机'), 350);
}

function save() {
  refreshMeta();
  persist();
}

function refreshSectionSelect() {
  const select = document.getElementById('newItemSection');
  const current = select.value;
  select.innerHTML = state.sections.map(section =>
    '<option value="' + esc(section.id) + '">' + esc(section.title || '未命名分类') + '</option>'
  ).join('');
  if (state.sections.some(section => section.id === current)) select.value = current;
}

function refreshMeta() {
  const items = allItems();
  const count = status => items.filter(item => item.status === status).length;
  const done = count('已完成');
  const cancelled = count('已取消');
  const active = items.length - cancelled;
  const pct = active ? Math.round(done / active * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    '已完成 ' + done + ' · 未完成 ' + count('未完成') + ' · 待定 ' + count('待定') + ' · 已取消 ' + cancelled;
  state.sections.forEach(section => {
    const badge = document.querySelector('[data-count="' + section.id + '"]');
    if (!badge) return;
    if (section.id === 'flow') {
      badge.textContent = '';
      badge.classList.remove('complete');
      return;
    }
    const sectionDone = section.items.filter(item => item.status === '已完成').length;
    const settled = section.items.filter(item => item.status === '已完成' || item.status === '已取消').length;
    badge.textContent = sectionDone + '/' + section.items.length;
    badge.classList.toggle('complete', section.items.length > 0 && settled === section.items.length);
  });
  refreshSectionSelect();
}

function flowGraphic() {
  const steps = [
    ['7:30', '酒店出发', '男方从酒店去男方家里'],
    ['门口', '放礼炮、鞭炮', '鞭炮由姐夫来放'],
    ['进门', '喝茶、给聘金、放礼品', '聘金放在红色盘子里'],
    ['之后', '闲聊一会', '然后出发去酒店'],
    ['酒店', '拍照、吃饭', '准备酒席'],
  ];
  const carry = [
    ['男主', '聘金，放在红色盘子里'],
    ['妈妈', '茅台、红酒'],
    ['姐姐', '红枣、桂圆、莲子、花生、粉丝'],
    ['外甥女', '香烟'],
    ['姐夫', '鞭炮；彩礼箱 1 个（打开）'],
    ['外甥', '彩礼箱 1 个（打开）'],
  ];
  return '<div class="flow"><div class="flow-steps">' + steps.map(([time, name, desc]) =>
    '<div class="flow-step"><div class="flow-time">' + time + '</div><div class="flow-rail"><div class="flow-dot"></div></div><div><div class="flow-name">' + name + '</div><div class="flow-desc">' + desc + '</div></div></div>'
  ).join('') + '</div>' +
    '<div class="carry"><div class="carry-title">进门时谁拿什么</div><div class="carry-grid">' +
    carry.map(([who, what]) => '<div class="carry-card"><div class="carry-who">' + who + '</div><div class="carry-what">' + what + '</div></div>').join('') +
    '</div></div></div>';
}

function renderItem(item) {
  const detail = item.detail
    ? '<textarea class="detail-input" data-field="detail" maxlength="2000">' + esc(item.detail) + '</textarea>'
    : '';
  const remove = '<button type="button" class="btn-text" data-action="delete-item" aria-label="删除">×</button>';
  return '<div class="item ' + statusClass(item.status) + '" id="item-' + esc(item.id) + '" data-id="' + esc(item.id) + '">' +
    '<div class="item-main"><input class="title-input" data-field="title" maxlength="120" value="' + esc(item.title) + '" aria-label="事项名称" autocomplete="off" />' +
    detail + '</div>' +
    '<select class="status ' + statusClass(item.status) + '" aria-label="标记">' + statusOptions(item.status) + '</select>' +
    remove + '</div>';
}

function renderList() {
  document.getElementById('list').innerHTML = state.sections.map(section => {
    const flowItem = section.id === 'flow'
      ? section.items.find(item => item.title === '现场流程')
      : null;
    const items = section.items.filter(item => item !== flowItem).map(renderItem).join('');
    const headerStatus = flowItem
      ? '<select class="status ' + statusClass(flowItem.status) + '" data-id="' + esc(flowItem.id) + '" aria-label="标记">' + statusOptions(flowItem.status) + '</select>'
      : '';
    const flowBody = flowItem ? flowGraphic() : '';
    const removeSection = section.custom
      ? '<button type="button" class="btn-text" data-action="delete-section" aria-label="删除分类">×</button>'
      : '';
    return '<section class="card" id="sec-' + esc(section.id) + '" data-section="' + esc(section.id) + '">' +
      '<h2><input class="section-title-input" data-action="rename-section" maxlength="30" value="' + esc(section.title) + '" aria-label="事项类别" />' +
      removeSection + headerStatus + '<span class="count" data-count="' + esc(section.id) + '"></span></h2>' +
      flowBody +
      (items || (flowItem ? '' : '<div class="empty-section">还没有条目</div>')) +
      '</section>';
  }).join('');
  refreshMeta();
}

function addItem() {
  const titleInput = document.getElementById('newItemTitle');
  const sectionSelect = document.getElementById('newItemSection');
  const title = titleInput.value.trim();
  const sectionId = sectionSelect.value;
  if (!title) {
    titleInput.focus();
    return;
  }
  const section = state.sections.find(entry => entry.id === sectionId);
  if (!section) {
    showToast('请先选择分类');
    return;
  }
  const item = { id: uid(), title, status: '未完成', custom: true };
  section.items.push(item);
  titleInput.value = '';
  renderList();
  document.getElementById('newItemSection').value = sectionId;
  save();
  const row = document.getElementById('item-' + item.id);
  if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  titleInput.focus();
}

function addSection() {
  const input = document.getElementById('newSectionTitle');
  const title = input.value.trim();
  if (!title) {
    input.focus();
    return;
  }
  const id = uid();
  state.sections.push({ id, title, custom: true, items: [] });
  input.value = '';
  renderList();
  document.getElementById('newItemSection').value = id;
  save();
}

document.getElementById('list').addEventListener('change', event => {
  if (!event.target.matches('select.status')) return;
  const row = event.target.closest('.item');
  const found = findItem(row ? row.dataset.id : event.target.dataset.id);
  if (!found || !STATUSES.includes(event.target.value)) return;
  found.item.status = event.target.value;
  const kind = statusClass(found.item.status);
  if (row) row.className = 'item ' + kind;
  event.target.className = 'status ' + kind;
  save();
});

document.getElementById('list').addEventListener('input', event => {
  const target = event.target;
  if (target.matches('[data-action="rename-section"]')) {
    const section = state.sections.find(entry => entry.id === target.closest('.card').dataset.section);
    if (!section) return;
    section.title = target.value;
    save();
    return;
  }
  if (target.dataset.field !== 'title' && target.dataset.field !== 'detail') return;
  const found = findItem(target.closest('.item').dataset.id);
  if (!found) return;
  found.item[target.dataset.field] = target.value;
  save();
});

document.getElementById('list').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.action === 'delete-item') {
    const found = findItem(button.closest('.item').dataset.id);
    if (!found) return;
    if (!confirm('删除「' + (found.item.title || '这项') + '」？')) return;
    found.section.items = found.section.items.filter(item => item.id !== found.item.id);
    renderList();
    save();
    return;
  }
  if (button.dataset.action === 'delete-section') {
    const section = state.sections.find(entry => entry.id === button.closest('.card').dataset.section);
    if (!section || !section.custom) return;
    if (!confirm('删除分类「' + (section.title || '未命名') + '」和里面的事项？')) return;
    state.sections = state.sections.filter(entry => entry.id !== section.id);
    renderList();
    save();
  }
});

document.getElementById('btnAddItem').addEventListener('click', addItem);
document.getElementById('newItemTitle').addEventListener('keydown', event => {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  addItem();
});
document.getElementById('btnAddSection').addEventListener('click', addSection);
document.getElementById('newSectionTitle').addEventListener('keydown', event => {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  addSection();
});

document.getElementById('btnSave').addEventListener('click', () => {
  rememberLocal();
  if (getSyncEnabled()) pushRemote(localVersion);
  else showToast('数据已保存在本机');
});

document.getElementById('btnShare').addEventListener('click', async () => {
  const url = getShareUrl();
  try {
    await navigator.clipboard.writeText(url);
    showToast('链接已复制');
  } catch (_) {
    prompt('复制这个链接发给大家：', url);
  }
});

document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '订婚清单.json';
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('已导出备份');
});

document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', event => {
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || !Array.isArray(data.sections)) throw new Error('invalid');
      if (!confirm('用这份备份覆盖当前清单？')) return;
      normalizeState(data);
      state = data;
      renderList();
      persist();
      showToast('已导入');
    } catch (_) {
      showToast('这个文件不是清单备份');
    }
  };
  reader.readAsText(file);
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('恢复最初的订婚清单？自定义事项和当前标记会清除。')) return;
  state = defaultState();
  renderList();
  persist();
  showToast('已恢复初始清单');
});

let supabaseClient = null;
let saveTimer = null;
let applyingRemote = false;
let localVersion = 0;
let ackedVersion = 0;

function getSyncEnabled() {
  return SYNC.enabled && SYNC.supabaseUrl && SYNC.supabaseAnonKey && window.supabase;
}

function setSyncUI(status, label) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + (status === 'on' ? 'on' : status === 'busy' ? 'busy' : 'off');
  document.getElementById('syncLabel').textContent = label;
}

function getShareUrl() {
  const pages = 'https://a956551943.github.io/weixiaohui/engagement/';
  const base = location.protocol === 'http:' || location.protocol === 'https:' ? location.href : pages;
  const url = new URL(base, pages);
  url.searchParams.set('room', ROOM_ID);
  return url.toString();
}

function stateSignature(data) {
  return JSON.stringify((data.sections || []).map(section => ({
    id: section.id,
    title: section.title,
    items: (section.items || []).map(item => [item.id, item.title, item.status, item.detail || '']),
  })));
}

function rememberLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
}

async function pushRemote(version) {
  if (!supabaseClient || applyingRemote) return;
  let errorMessage = '';
  try {
    const { error } = await supabaseClient.from('trip_states').upsert({
      room_id: ROOM_ID,
      data: state,
      updated_at: new Date().toISOString(),
    });
    if (error) errorMessage = error.message || error.details || '写入被拒绝';
  } catch (err) {
    errorMessage = (err && err.message) || '网络失败';
  }
  if (errorMessage) {
    setSyncUI('off', '数据库连不上');
    if (!pushRemote.told) {
      pushRemote.told = true;
      showToast('没写进数据库，这次修改只留在这台手机');
    }
    return;
  }
  pushRemote.told = false;
  if (version >= ackedVersion) ackedVersion = version;
  if (localVersion !== version) {
    pushRemote(localVersion);
    return;
  }
  setSyncUI('on', '多人同步 · ' + ROOM_ID);
  showToast('已写入共享清单');
}

async function fetchRemote() {
  try {
    const { data, error } = await supabaseClient.from('trip_states').select('data').eq('room_id', ROOM_ID).maybeSingle();
    if (error) return { error: error.message || '读取失败' };
    if (!data || !data.data || !Array.isArray(data.data.sections)) return { data: null };
    return { data: data.data };
  } catch (err) {
    return { error: (err && err.message) || '网络失败' };
  }
}

function applyRemote(data) {
  if (localVersion !== ackedVersion) return;
  normalizeState(data);
  upgradeState(data);
  if (stateSignature(data) === stateSignature(state)) return;
  applyingRemote = true;
  state = data;
  renderList();
  rememberLocal();
  applyingRemote = false;
}

function subscribeRemote() {
  supabaseClient
    .channel('engagement_' + ROOM_ID)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'trip_states',
      filter: 'room_id=eq.' + ROOM_ID,
    }, (payload) => {
      if (payload.new && payload.new.data) applyRemote(payload.new.data);
    })
    .subscribe();
}

async function initApp() {
  const stored = loadState();
  if (stored) state = stored;
  normalizeState(state);
  const upgraded = upgradeState(state);
  renderList();
  rememberLocal();

  if (!getSyncEnabled()) {
    setSyncUI('off', '单机模式');
    return;
  }

  supabaseClient = window.supabase.createClient(SYNC.supabaseUrl, SYNC.supabaseAnonKey);
  setSyncUI('busy', '连接中…');
  const remote = await fetchRemote();
  if (remote.error) {
    setSyncUI('off', '数据库连不上');
    showToast('共享数据库连不上，清单只保存在这台手机');
    return;
  }
  if (remote.data) {
    applyingRemote = true;
    state = remote.data;
    normalizeState(state);
    applyingRemote = false;
  }
  const needWrite = upgradeState(state) || upgraded || !remote.data;
  renderList();
  rememberLocal();
  subscribeRemote();
  if (needWrite) {
    localVersion = 1;
    await pushRemote(localVersion);
    return;
  }
  setSyncUI('on', '多人同步 · ' + ROOM_ID);
}

initApp();
</script>
