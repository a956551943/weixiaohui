<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>大阪 5天4晚 · 出行计划</title>
  <style>
    :root {
      --bg: #eef2f6;
      --card: #fff;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --done: #ecfdf5;
      --done-border: #6ee7b7;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 120px);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: calc(72px + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: linear-gradient(145deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
      color: #fff;
      padding: 18px 16px 14px;
      box-shadow: 0 4px 20px rgba(37,99,235,.25);
    }
    header h1 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
    header .meta { font-size: 12px; opacity: .88; margin-top: 4px; }
    .progress-bar {
      margin-top: 10px;
      background: rgba(255,255,255,.22);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #86efac, #4ade80);
      border-radius: 99px;
      transition: width .3s;
      width: 0%;
    }
    .progress-text { font-size: 11px; margin-top: 5px; opacity: .85; }

    nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      width: 100%;
      gap: 0;
      padding: 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 99;
    }
    nav button {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 12px 2px;
      border: none;
      border-bottom: 3px solid transparent;
      background: #fff;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
      text-align: center;
      font-weight: 500;
      line-height: 1.25;
      border-radius: 0;
    }
    nav button + button {
      border-left: 1px solid var(--border);
    }
    nav button.active {
      background: #eff6ff;
      color: var(--primary-dark);
      font-weight: 700;
      border-bottom-color: var(--primary);
      box-shadow: none;
    }

    main { padding: 14px 16px 20px; max-width: none; width: 100%; margin: 0; }
    .panel { display: none; animation: fadeIn .25s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.8);
    }
    .card h2 {
      font-size: 15px;
      color: var(--text);
      margin-bottom: 12px;
      padding-bottom: 0;
      border: none;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .card h3 {
      font-size: 13px;
      color: var(--text);
      margin: 14px 0 8px;
      font-weight: 600;
    }
    .card h3:first-of-type { margin-top: 0; }

    .hint {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border: 1px solid #fde68a;
      padding: 12px 14px;
      font-size: 13px;
      color: #92400e;
      border-radius: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all .2s;
      background: #fafbfc;
    }
    .check-item.done { background: var(--done); border-color: var(--done-border); }
    .check-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .check-body { flex: 1; min-width: 0; }
    .check-title { font-size: 14px; font-weight: 500; }
    .check-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .check-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .check-fields.cols3 { grid-template-columns: 1fr 1fr 1fr; }
    .check-fields.full { grid-template-columns: 1fr; }
    .field label {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: #fff;
      -webkit-appearance: none;
    }
    .field input:focus, .field textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    .field textarea { min-height: 60px; resize: vertical; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      margin-top: 8px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th {
      background: #f1f5f9;
      color: var(--text);
      padding: 10px 8px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
    }
    td {
      padding: 10px 8px;
      border-top: 1px solid var(--border);
      vertical-align: top;
      background: #fff;
    }
    tr:nth-child(even) td { background: #fafbfc; }

    .info-grid {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 6px 10px;
      font-size: 13px;
    }
    .info-grid dt { color: var(--muted); font-size: 12px; }
    .info-grid dd { font-weight: 500; }

    .fab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + var(--safe-bottom));
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .fab-bar button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      box-shadow: 0 2px 10px rgba(37,99,235,.3);
    }
    .btn-reset {
      background: #f1f5f9;
      color: var(--muted);
      flex: 0 0 auto;
      padding: 13px 16px;
    }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 13px;
      opacity: 0;
      transition: all .3s;
      pointer-events: none;
      z-index: 200;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sync-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 11px;
      flex-wrap: wrap;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; }
    .sync-dot.on { background: #4ade80; }
    .sync-dot.busy { background: #fbbf24; }
    .sync-dot.off { background: #94a3b8; }
    .btn-share {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 11px;
      cursor: pointer;
    }
    .ref-note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

    /* ── 逐日行程 ── */
    #panel-d1 { --day-accent: #3b82f6; --day-soft: #eff6ff; }
    #panel-d2 { --day-accent: #8b5cf6; --day-soft: #f5f3ff; }
    #panel-d3 { --day-accent: #ec4899; --day-soft: #fdf2f8; }
    #panel-d4 { --day-accent: #f59e0b; --day-soft: #fffbeb; }
    #panel-d5 { --day-accent: #10b981; --day-soft: #ecfdf5; }

    .day-hero {
      background: linear-gradient(135deg, var(--day-accent) 0%, color-mix(in srgb, var(--day-accent) 80%, #fff) 100%);
      color: #fff;

      margin-bottom: 16px;

    .day-hero-top {

      margin-bottom: 8px;

    .day-badge {

      letter-spacing: .03em;

    .day-hero-date { font-size: 12px; opacity: .9; }
    .day-hero-title {
      font-size: 18px;

      line-height: 1.35;
      letter-spacing: -.02em;
      margin-bottom: 8px;
    }
    .day-hero-hint {
      font-size: 12px;
      line-height: 1.55;
      opacity: .92;
      background: rgba(0,0,0,.12);
      padding: 10px 12px;
      border-radius: 10px;

    .timeline {
      position: relative;
      padding-left: 4px;
    }
    .timeline::before {
      content: '';

      left: 11px;
      top: 8px;

      background: linear-gradient(180deg, var(--day-accent), var(--border));
      border-radius: 2px;
      opacity: .35;

    .step-item {

    .step-item:last-child { margin-bottom: 0; }

    .step-dot {

      border-radius: 50%;
      background: var(--day-accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 2px var(--day-accent);
      margin-top: 14px;
      margin-left: 5px;
      flex-shrink: 0;
    }
    .step-item.type-交通 .step-dot { background: #3b82f6; box-shadow: 0 0 0 2px #3b82f6; }
    .step-item.type-购物 .step-dot { background: #ec4899; box-shadow: 0 0 0 2px #ec4899; }
    .step-item.type-游玩 .step-dot { background: #10b981; box-shadow: 0 0 0 2px #10b981; }
    .step-item.type-午餐 .step-dot,
    .step-item.type-晚餐 .step-dot,
    .step-item.type-早餐 .step-dot,
    .step-item.type-下午茶 .step-dot { background: #f59e0b; box-shadow: 0 0 0 2px #f59e0b; }
    .step-item.type-住宿 .step-dot { background: #8b5cf6; box-shadow: 0 0 0 2px #8b5cf6; }

    .step-body {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226,232,240,.6);
    }

    .step-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .step-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--day-accent);
      font-variant-numeric: tabular-nums;
    }
    .step-type {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--day-soft);
      color: var(--day-accent);
    }
    .step-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -.01em;
      margin-bottom: 2px;
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 4px;

    .meta-chip {
      font-size: 11px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 9px;
      line-height: 1.35;
    }
    .meta-chip b {
      color: var(--muted);
      font-weight: 500;
      margin-right: 4px;
    }

    .route-steps {
      margin: 10px 0 4px;
      padding: 10px 12px 10px 28px;
      background: var(--day-soft);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.65;

    .route-steps li { margin-bottom: 2px; }
    .route-steps li::marker { color: var(--day-accent); font-weight: 700; }

    .step-map {
      margin: 10px 0 4px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #f1f5f9;
    }
    .step-map img {
      display: block;

      height: auto;
      min-height: 100px;
      max-height: 180px;

    }
    .step-map .map-caption {
      padding: 7px 10px;
      font-size: 10px;
      color: var(--muted);
      background: #fafbfc;
      text-align: center;
    }

    .step-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .step-actions a {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      background: var(--day-accent);
      color: #fff;
      box-shadow: 0 2px 6px color-mix(in srgb, var(--day-accent) 30%, transparent);
    }
    .step-actions a.secondary {
      background: #f1f5f9;
      color: var(--text);
      box-shadow: none;
      border: 1px solid var(--border);
    }
    .step-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      line-height: 1.55;
    }
    .step-note b { color: var(--text); font-weight: 600; }

    .pay-badge {
      display: inline-block;
      font-size: 11px;

      border: 1px solid #fde047;

    .ref-card { margin-top: 4px; }
    .ref-block { margin-top: 14px; }
    .ref-block:first-child { margin-top: 0; }
    .ref-block h3 {

    .lodging-card {

    .lodging-card dl {

    .lodging-card dt { color: var(--muted); font-size: 12px; }
    .lodging-card dd { font-weight: 500; }

    .panel[id^="panel-d"] table a { color: var(--day-accent, var(--primary)); word-break: break-all; }

    .feature-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 14px 16px;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #b45309, #f59e0b 50%, #fbbf24);

    .feature-link strong { display: block; font-size: 15px; font-weight: 700; }

    nav button small {

    @media (min-width: 640px) {

<script>
const STORAGE_KEY = 'osaka2026_trip_v1';
const SYNC = window.TRIP_SYNC || { enabled: false, defaultRoom: 'osaka2026-wxh' };
const ROOM_ID = new URLSearchParams(location.search).get('room') || SYNC.defaultRoom || 'osaka2026-wxh';

let memoryState = {};
let supabaseClient = null;
let syncChannel = null;
let saveTimer = null;
let applyingRemote = false;

function getSyncEnabled() {
  return SYNC.enabled && SYNC.supabaseUrl && SYNC.supabaseAnonKey && window.supabase;
}

function setSyncUI(status, label) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + (status === 'on' ? 'on' : status === 'busy' ? 'busy' : 'off');
  document.getElementById('syncLabel').textContent = label;
}

function loadState() {
  return { ...memoryState };
}

function setMemoryState(state) {
  memoryState = state || {};
  try { localStorage.setItem(STORAGE_KEY + '_' + ROOM_ID, JSON.stringify(memoryState)); } catch (_) {}
}

function saveState(state) {
  if (applyingRemote) return;
  setMemoryState(state);
  updateProgress();
  if (getSyncEnabled()) {
    setSyncUI('busy', '同步中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushRemote, 500);
  } else {
    showToast('已保存（本机）');
  }
}

async function pushRemote() {
  if (!supabaseClient) return;
  const { error } = await supabaseClient.from('trip_states').upsert({
    room_id: ROOM_ID,
    data: memoryState,
    updated_at: new Date().toISOString(),
  });
  if (error) {
    setSyncUI('off', '同步失败');
    showToast('同步失败，已存本机');
    return;
  }
  setSyncUI('on', `多人同步 · 房间 ${ROOM_ID}`);
  showToast('已同步');
}

async function pullRemote() {
  if (!supabaseClient) return;
  const { data, error } = await supabaseClient.from('trip_states').select('data').eq('room_id', ROOM_ID).maybeSingle();
  if (error || !data) return;
  applyingRemote = true;
  setMemoryState(data.data || {});
  refreshAllSections();
  updateProgress();
  applyingRemote = false;
}

function subscribeRemote() {
  if (!supabaseClient) return;
  syncChannel = supabaseClient
    .channel('trip_' + ROOM_ID)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'trip_states',
      filter: `room_id=eq.${ROOM_ID}`,
    }, (payload) => {
      if (payload.new?.data) {
        applyingRemote = true;
        setMemoryState(payload.new.data);
        refreshAllSections();
        updateProgress();
        applyingRemote = false;
        setSyncUI('on', `多人同步 · 房间 ${ROOM_ID}`);
      }
    })
    .subscribe();
}

async function initSync() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY + '_' + ROOM_ID);
    if (raw) memoryState = JSON.parse(raw);
  } catch (_) { memoryState = {}; }

  if (!getSyncEnabled()) {
    setSyncUI('off', `单机模式 · 房间 ${ROOM_ID}`);
    document.getElementById('syncHint').textContent =
      '当前为单机保存。要三人共享编辑，请按 docs/多人共享设置.md 配置 Supabase 后 push。';
    return;
  }

  supabaseClient = window.supabase.createClient(SYNC.supabaseUrl, SYNC.supabaseAnonKey);
  setSyncUI('busy', '连接中…');
  await pullRemote();
  subscribeRemote();
  setSyncUI('on', `多人同步 · 房间 ${ROOM_ID}`);
  document.getElementById('syncHint').textContent =
    '多人实时同步已开启。三人打开同一链接，勾选和填写会互相同步。';
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderStepCard(step) {
  const type = step.type || '其他';
  const typeCls = esc(type);
  let html = `<article class="step-item type-${typeCls}">
    <div class="step-dot" aria-hidden="true"></div>
    <div class="step-body">
      <div class="step-meta">
        <span class="step-time">${esc(step.time)}</span>
        <span class="step-type">${typeCls}</span>
      </div>
      <h3 class="step-title">${esc(step.title)}</h3>`;

  const chips = [];
  if (step.from) chips.push(`<span class="meta-chip"><b>起点</b>${esc(step.from)}</span>`);
  if (step.to) chips.push(`<span class="meta-chip"><b>终点</b>${esc(step.to)}</span>`);
  if (step.transport) chips.push(`<span class="meta-chip"><b>交通</b>${esc(step.transport)}</span>`);
  if (step.duration) chips.push(`<span class="meta-chip"><b>耗时</b>${esc(step.duration)}</span>`);
  if (step.cost && step.cost !== '—') chips.push(`<span class="meta-chip"><b>费用</b>${esc(step.cost)}</span>`);
  if (step.pay && step.pay !== '—') chips.push(`<span class="meta-chip"><b>付款</b>${esc(step.pay)}</span>`);
  if (chips.length) html += `<div class="meta-chips">${chips.join('')}</div>`;
  else if (step.pay) html += `<span class="pay-badge">付款 ${esc(step.pay)}${step.cost && step.cost !== '—' ? ' · ' + esc(step.cost) : ''}</span>`;

  if (step.route && step.route.length) {
    html += '<ol class="route-steps">' + step.route.map(r => `<li>${r}</li>`).join('') + '</ol>';
  }

  if (step.mapImg) {
    html += `<div class="step-map">
      <img src="${esc(step.mapImg)}" alt="路线示意图" loading="lazy" referrerpolicy="no-referrer"
        onerror="this.parentElement.querySelector('.map-caption').textContent='地图加载失败，请点下方导航按钮'; this.style.display='none'" />
      <div class="map-caption">路线示意图</div>
    </div>`;
  }

  if (step.note) html += `<div class="step-note">${step.note}</div>`;

  if (step.mapLink || (step.links && step.links.length)) {
    html += '<div class="step-actions">';
    if (step.mapLink) {
      html += `<a href="${esc(step.mapLink)}" target="_blank" rel="noopener">Google 导航</a>`;
    }
    (step.links || []).forEach(l => {
      html += `<a class="secondary" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`;
    });
    html += '</div>';
  }

  html += '</div></article>';
  return html;
}

function renderRefTable(title, rows, cols) {
  if (!rows || !rows.length) return '';
  const heads = cols.map(c => `<th>${c.label}</th>`).join('');
  const body = rows.map(r => `<tr>${cols.map(c => `<td>${r[c.key] || '—'}</td>`).join('')}</tr>`).join('');
  return `<div class="ref-block"><h3>${title}</h3><table><tr>${heads}</tr>${body}</table></div>`;
}

function renderDayPanel(day) {

  let html = `<div class="day-hero">

    <p class="day-hero-hint">${day.hint}</p>
  </div>`;

  if (day.featureLink) {
    html += `<a class="feature-link" href="${esc(day.featureLink.href)}">
      <span><strong>${esc(day.featureLink.label)}</strong></span><b>→</b></a>`;
  }

  html += `<div class="timeline">${day.steps.map(renderStepCard).join('')}</div>`;

  const refs = day.refs || {};
  if (refs.meals || refs.shopping || refs.spots) {
    html += '<div class="card ref-card"><h2>当日参考</h2>';
    html += renderRefTable('餐饮', refs.meals, [
      { key: 'slot', label: '餐次' },
      { key: 'place', label: '地点' },
      { key: 'book', label: '预约' },
      { key: 'cost', label: '人均' },
    ]);
    html += renderRefTable('购物', refs.shopping, [
      { key: 'item', label: '买什么' },
      { key: 'shop', label: '店铺' },
      { key: 'how', label: '怎么买' },
    ]);
    html += renderRefTable('景点 / 门票', refs.spots, [
      { key: 'name', label: '名称' },
      { key: 'addr', label: '地址' },
      { key: 'ticket', label: '门票' },
    ]);
    html += '</div>';
  }

  el.innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function itemId(section, idx) { return `${section}_${idx}`; }

function renderCheckSection(containerId, sectionKey, config) {
  const el = document.getElementById(containerId);
  const state = loadState();
  let html = `<h2>${config.title}</h2>`;
  const isSimple = typeof config.items[0] === 'string';

  config.items.forEach((item, idx) => {
    const id = itemId(sectionKey, idx);
    const title = isSimple ? item : item.t;
    const sub = isSimple ? '' : item.s;
    const checked = state[id]?.checked || false;
    const fields = state[id]?.fields || {};

    html += `<div class="check-item${checked ? ' done' : ''}" data-id="${id}">
      <input type="checkbox" ${checked ? 'checked' : ''} aria-label="${title}" />
      <div class="check-body">
        <div class="check-title">${title}</div>
        ${sub ? `<div class="check-sub">${sub}</div>` : ''}
        <div class="check-fields${config.fields.length >= 3 ? ' cols3' : ''}${config.fields.length === 1 ? ' full' : ''}">
          ${config.fields.map((f, fi) => `
            <div class="field">
              <label>${f}</label>
              <input type="text" data-field="${fi}" value="${(fields[fi] || '').replace(/"/g, '&quot;')}" placeholder="填写${f}" />
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
  });

  el.innerHTML = html;

  el.querySelectorAll('.check-item').forEach(row => {
    const id = row.dataset.id;
    const cb = row.querySelector('input[type=checkbox]');
    cb.addEventListener('change', () => {
      const s = loadState();
      s[id] = s[id] || { fields: {} };
      s[id].checked = cb.checked;
      row.classList.toggle('done', cb.checked);
      saveState(s);
    });
    row.querySelectorAll('input[type=text]').forEach(inp => {
      inp.addEventListener('input', () => {
        const s = loadState();
        s[id] = s[id] || { checked: false, fields: {} };
        s[id].fields[inp.dataset.field] = inp.value;
        saveState(s);
      });
    });
  });
}

function updateProgress() {
  const state = loadState();
  let total = 0, done = 0;
  Object.keys(DATA).forEach(key => {
    DATA[key].items.forEach((_, idx) => {
      total++;
      if (state[itemId(key, idx)]?.checked) done++;
    });
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `准备清单 ${done}/${total} 已完成`;
}

// Tab switch
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

  if (getSyncEnabled()) pushRemote().then(() => showToast('已同步到云端'));
  else showToast('数据已保存在本机');
});
document.getElementById('btnShare').addEventListener('click', async () => {
  const url = getShareUrl();
  try {
    await navigator.clipboard.writeText(url);
    showToast('链接已复制，发给同行人');
  } catch {
    prompt('复制此链接发给三人：', url);
  }
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('确定清空所有勾选和填写内容？')) {
    memoryState = {};
    localStorage.removeItem(STORAGE_KEY + '_' + ROOM_ID);
    if (supabaseClient) supabaseClient.from('trip_states').upsert({ room_id: ROOM_ID, data: {}, updated_at: new Date().toISOString() });
    location.reload();
  }
});

async function initApp() {
  await initSync();
  renderCheckSection('section-shopping', 'shopping', DATA.shopping);
  renderCheckSection('section-gift', 'gift', DATA.gift);
  renderAllDays();
  updateProgress();
}
