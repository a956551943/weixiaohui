<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root {
      --bg: #f0f4f8;

      --primary-dark: #1e40af;
      --text: #1e293b;
      --muted: #64748b;

      --done: #dcfce7;

      --warn: #fff7ed;
      --radius: 12px;

    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: calc(72px + var(--safe-bottom));
    }
    header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 20px 16px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(30,64,175,.25);
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header .meta { font-size: 12px; opacity: .9; margin-top: 6px; }
    .progress-bar {

      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #86efac;
      border-radius: 99px;
      transition: width .3s;

    }
    .progress-text { font-size: 11px; margin-top: 4px; opacity: .85; }

    nav {

      overflow-x: auto;
      -webkit-overflow-scrolling: touch;

      top: 0;
      z-index: 99;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      flex: 0 0 auto;
      padding: 12px 14px;
      border: none;
      background: none;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .2s;
      white-space: nowrap;
    }
    nav button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    main { padding: 12px; max-width: 640px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card h2 {
      font-size: 15px;
      color: var(--primary-dark);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eff6ff;
    }
    .card h3 {
      font-size: 13px;
      color: var(--text);
      margin: 14px 0 8px;
      font-weight: 600;
    }
    .card h3:first-of-type { margin-top: 0; }

    .hint {
      background: var(--warn);
      border-left: 3px solid #f59e0b;
      padding: 10px 12px;
      font-size: 12px;
      color: #92400e;
      border-radius: 0 8px 8px 0;
      margin-bottom: 12px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      transition: background .2s;
    }
    .check-item.done { background: var(--done); border-color: var(--done-border); }
    .check-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .check-body { flex: 1; min-width: 0; }
    .check-title { font-size: 14px; font-weight: 500; }
    .check-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .check-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .check-fields.cols3 { grid-template-columns: 1fr 1fr 1fr; }
    .check-fields.full { grid-template-columns: 1fr; }
    .field label {

      font-size: 10px;
      color: var(--muted);

    }
    .field input, .field textarea {
      width: 100%;
      padding: 8px 10px;

    .field input:focus, .field textarea:focus {

    table {

    .btn-reset {

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;

    .sync-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;

    .lodging-card dl {

    .panel[id^="panel-d"] table a { color: var(--primary); word-break: break-all; }
    .panel[id^="panel-d"] td { font-size: 12px; line-height: 1.45; }

    .feature-link {

    .feature-link strong { display: block; font-size: 15px; }
    .feature-link span { display: block; margin-top: 2px; font-size: 11px; opacity: .9; }
    .feature-link b { flex: 0 0 auto; font-size: 20px; }
  </style>

<body>

        <dt>返程</dt><dd>8/31 12:35 → 14:20</dd>
        <dt>民宿</dt><dd>柏里 西淀川区 宿の四 · 555-0022</dd>
        <dt>最近站</dt><dd>JR 塚本（步行 5–8 分）</dd>
        <dt>入住</dt><dd>16:00 后 · 不含早</dd>
        <dt>退房</dt><dd>8/31 10:00 前</dd>
        <dt>交通卡</dt><dd>抵达机场办 ICOCA，全程刷卡</dd>

<script>
const STORAGE_KEY = 'osaka2026_trip_v1';
const SYNC = window.TRIP_SYNC || { enabled: false, defaultRoom: 'osaka2026-wxh' };
const ROOM_ID = new URLSearchParams(location.search).get('room') || SYNC.defaultRoom || 'osaka2026-wxh';

let memoryState = {};
let supabaseClient = null;
let syncChannel = null;
let saveTimer = null;
let applyingRemote = false;

function getSyncEnabled() {
  return SYNC.enabled && SYNC.supabaseUrl && SYNC.supabaseAnonKey && window.supabase;
}

function setSyncUI(status, label) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + (status === 'on' ? 'on' : status === 'busy' ? 'busy' : 'off');
  document.getElementById('syncLabel').textContent = label;
}

function loadState() {
  return { ...memoryState };
}

function setMemoryState(state) {
  memoryState = state || {};
  try { localStorage.setItem(STORAGE_KEY + '_' + ROOM_ID, JSON.stringify(memoryState)); } catch (_) {}
}

function saveState(state) {
  if (applyingRemote) return;
  setMemoryState(state);
  updateProgress();
  if (getSyncEnabled()) {
    setSyncUI('busy', '同步中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushRemote, 500);
  } else {
    showToast('已保存（本机）');
  }
}

async function pushRemote() {
  if (!supabaseClient) return;
  const { error } = await supabaseClient.from('trip_states').upsert({
    room_id: ROOM_ID,
    data: memoryState,
    updated_at: new Date().toISOString(),
  });
  if (error) {
    setSyncUI('off', '同步失败');
    showToast('同步失败，已存本机');
    return;
  }
  setSyncUI('on', `多人同步 · 房间 ${ROOM_ID}`);
  showToast('已同步');
}

async function pullRemote() {
  if (!supabaseClient) return;
  const { data, error } = await supabaseClient.from('trip_states').select('data').eq('room_id', ROOM_ID).maybeSingle();
  if (error || !data) return;
  applyingRemote = true;
  setMemoryState(data.data || {});
  refreshAllSections();
  updateProgress();
  applyingRemote = false;
}

function subscribeRemote() {
  if (!supabaseClient) return;
  syncChannel = supabaseClient
    .channel('trip_' + ROOM_ID)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'trip_states',
      filter: `room_id=eq.${ROOM_ID}`,
    }, (payload) => {
      if (payload.new?.data) {
        applyingRemote = true;
        setMemoryState(payload.new.data);
        refreshAllSections();
        updateProgress();
        applyingRemote = false;
        setSyncUI('on', `多人同步 · 房间 ${ROOM_ID}`);
      }
    })
    .subscribe();
}

async function initSync() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY + '_' + ROOM_ID);
    if (raw) memoryState = JSON.parse(raw);
  } catch (_) { memoryState = {}; }

  if (!getSyncEnabled()) {
    setSyncUI('off', `单机模式 · 房间 ${ROOM_ID}`);
    document.getElementById('syncHint').textContent =
      '当前为单机保存。要三人共享编辑，请按 docs/多人共享设置.md 配置 Supabase 后 push。';
    return;
  }

  supabaseClient = window.supabase.createClient(SYNC.supabaseUrl, SYNC.supabaseAnonKey);
  setSyncUI('busy', '连接中…');
  await pullRemote();
  subscribeRemote();
  setSyncUI('on', `多人同步 · 房间 ${ROOM_ID}`);
  document.getElementById('syncHint').textContent =
    '多人实时同步已开启。三人打开同一链接，勾选和填写会互相同步。';
}

function getShareUrl() {
  const u = new URL(location.href);
  u.searchParams.set('room', ROOM_ID);
  return u.toString();
}

function refreshAllSections() {
  renderCheckSection('section-booking', 'booking', DATA.booking);
  renderCheckSection('section-clothes', 'clothes', DATA.clothes);
  renderCheckSection('section-daily', 'daily', DATA.daily);
  renderCheckSection('section-amenities', 'amenities', DATA.amenities);
  renderCheckSection('section-prep', 'prep', DATA.prep);
  renderCheckSection('section-shopping', 'shopping', DATA.shopping);
  renderCheckSection('section-gift', 'gift', DATA.gift);
  renderCheckSection('section-luggage', 'luggage', DATA.luggage);
  renderCheckSection('section-memo', 'memo', DATA.memo);
}

const DATA = {
  booking: {
    title: '1.1 证件与预订',
    fields: ['负责人', '完成日期', '备注'],
    items: [
      '护照有效期 ≥ 6 个月',
      '日本签证',
      '机票订单（8/27 去 · 8/31 回）',
      '民宿订单（西淀川区柏里 / 宿の四）',
      '入住前确认洗漱用品/毛巾/拖鞋/洗衣机',
      'USJ 门票（8/30 已确定去）',
      'USJ Express Pass（可选，含任天堂入场确约更稳）',
      '大阪城天守阁 WEB 票',
      '大阪城 Crossfield 下午茶预约（8/29 约15:00，备注景观位）',
      '香奈儿阪急精品来店预约（官网 book-appointment · 约 8/28）',
      '日本 eSIM / 漫游开通',
      '兑换日元现金',
      '信用卡境外支付确认',
      '下载 USJ 官方 App（必装）',
      '8/29 当天确认神户花火 @kobehanabi（风大可取消、无顺延）',
    ],
  },

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderStepCard(step) {
  const typeCls = esc(step.type || '其他');
  let html = `<article class="step-card">
    <div class="step-head">
      <span class="step-time">${esc(step.time)}</span>
      <span class="step-type ${typeCls}">${typeCls}</span>
      <div class="step-title">${esc(step.title)}</div>
    </div>`;

  if (step.from || step.to || step.transport) {
    html += '<dl class="route-grid">';
    if (step.from) html += `<div><dt>起点</dt><dd>${esc(step.from)}</dd></div>`;
    if (step.to) html += `<div><dt>终点</dt><dd>${esc(step.to)}</dd></div>`;
    if (step.transport) html += `<div><dt>交通</dt><dd>${esc(step.transport)}</dd></div>`;
    if (step.duration) html += `<div><dt>耗时</dt><dd>${esc(step.duration)}</dd></div>`;
    if (step.cost) html += `<div><dt>费用</dt><dd>${esc(step.cost)}</dd></div>`;
    if (step.pay) html += `<div><dt>付款</dt><dd>${esc(step.pay)}</dd></div>`;
    html += '</dl>';
  } else if (step.pay) {
    html += `<span class="pay-badge">付款：${esc(step.pay)}${step.cost ? ' · ' + esc(step.cost) : ''}</span>`;
  }

  if (step.route && step.route.length) {
    html += '<ol class="route-steps">' + step.route.map(r => `<li>${r}</li>`).join('') + '</ol>';
  }

  if (step.mapImg) {
    html += `<div class="step-map">
      <img src="${esc(step.mapImg)}" alt="路线示意图" loading="lazy" referrerpolicy="no-referrer"
        onerror="this.parentElement.querySelector('.map-caption').textContent='地图加载失败，请点下方 Google 导航'; this.style.display='none'" />
      <div class="map-caption">路线示意图 · 红/蓝点为起终点大致位置</div>
    </div>`;
  }

  if (step.note) html += `<div class="step-note">${step.note}</div>`;

  if (step.mapLink || (step.links && step.links.length)) {
    html += '<div class="step-actions">';
    if (step.mapLink) {
      html += `<a href="${esc(step.mapLink)}" target="_blank" rel="noopener">📍 打开 Google 导航</a>`;
    }
    (step.links || []).forEach(l => {
      html += `<a class="secondary" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`;
    });
    html += '</div>';
  }

  html += '</article>';
  return html;
}

function renderRefTable(title, rows, cols) {
  if (!rows || !rows.length) return '';
  const heads = cols.map(c => `<th>${c.label}</th>`).join('');
  const body = rows.map(r => `<tr>${cols.map(c => `<td>${r[c.key] || '—'}</td>`).join('')}</tr>`).join('');
  return `<div class="ref-block"><h3>${title}</h3><table><tr>${heads}</tr>${body}</table></div>`;
}

function renderDayPanel(day) {
  const el = document.getElementById('panel-' + day.id);
  if (!el) return;

  let html = `<div class="hint">${day.hint}</div>`;

  if (day.featureLink) {
    html += `<a class="feature-link" href="${esc(day.featureLink.href)}">
      <span><strong>${esc(day.featureLink.label)}</strong></span><b>→</b></a>`;
  }

  html += `<div class="card">
    <div class="day-panel-head">
      <h2>${esc(day.title)}</h2>
      <div class="day-date">${esc(day.date)}</div>
    </div>
    ${day.steps.map(renderStepCard).join('')}
  </div>`;

  const refs = day.refs || {};
  if (refs.meals || refs.shopping || refs.spots) {
    html += '<div class="card"><h2>当日参考</h2>';
    html += renderRefTable('餐饮', refs.meals, [
      { key: 'slot', label: '餐次' },
      { key: 'place', label: '地点' },
      { key: 'book', label: '预约' },
      { key: 'cost', label: '人均' },
    ]);
    html += renderRefTable('购物', refs.shopping, [
      { key: 'item', label: '买什么' },
      { key: 'shop', label: '店铺' },
      { key: 'how', label: '怎么买' },
    ]);
    html += renderRefTable('景点/门票', refs.spots, [
      { key: 'name', label: '名称' },
      { key: 'addr', label: '地址' },
      { key: 'ticket', label: '门票/说明' },
    ]);
    html += '</div>';
  }

  el.innerHTML = html;
}

function renderAllDays() {
  (window.DAY_PLANS || []).forEach(renderDayPanel);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function itemId(section, idx) { return `${section}_${idx}`; }

function renderCheckSection(containerId, sectionKey, config) {
  const el = document.getElementById(containerId);
  const state = loadState();
  let html = `<h2>${config.title}</h2>`;
  const isSimple = typeof config.items[0] === 'string';

  config.items.forEach((item, idx) => {
    const id = itemId(sectionKey, idx);
    const title = isSimple ? item : item.t;
    const sub = isSimple ? '' : item.s;
    const checked = state[id]?.checked || false;
    const fields = state[id]?.fields || {};

    html += `<div class="check-item${checked ? ' done' : ''}" data-id="${id}">
      <input type="checkbox" ${checked ? 'checked' : ''} aria-label="${title}" />
      <div class="check-body">
        <div class="check-title">${title}</div>
        ${sub ? `<div class="check-sub">${sub}</div>` : ''}
        <div class="check-fields${config.fields.length >= 3 ? ' cols3' : ''}${config.fields.length === 1 ? ' full' : ''}">
          ${config.fields.map((f, fi) => `
            <div class="field">
              <label>${f}</label>
              <input type="text" data-field="${fi}" value="${(fields[fi] || '').replace(/"/g, '&quot;')}" placeholder="填写${f}" />
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
  });

  el.innerHTML = html;

  el.querySelectorAll('.check-item').forEach(row => {
    const id = row.dataset.id;
    const cb = row.querySelector('input[type=checkbox]');
    cb.addEventListener('change', () => {
      const s = loadState();
      s[id] = s[id] || { fields: {} };
      s[id].checked = cb.checked;
      row.classList.toggle('done', cb.checked);
      saveState(s);
    });
    row.querySelectorAll('input[type=text]').forEach(inp => {
      inp.addEventListener('input', () => {
        const s = loadState();
        s[id] = s[id] || { checked: false, fields: {} };
        s[id].fields[inp.dataset.field] = inp.value;
        saveState(s);
      });
    });
  });
}

function updateProgress() {
  const state = loadState();
  let total = 0, done = 0;
  Object.keys(DATA).forEach(key => {
    DATA[key].items.forEach((_, idx) => {
      total++;
      if (state[itemId(key, idx)]?.checked) done++;
    });
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `准备清单 ${done}/${total} 已完成`;
}

// Tab switch
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('btnSave').addEventListener('click', () => {
  if (getSyncEnabled()) pushRemote().then(() => showToast('已同步到云端'));
  else showToast('数据已保存在本机');
});
document.getElementById('btnShare').addEventListener('click', async () => {
  const url = getShareUrl();
  try {
    await navigator.clipboard.writeText(url);
    showToast('链接已复制，发给同行人');
  } catch {
    prompt('复制此链接发给三人：', url);
  }
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('确定清空所有勾选和填写内容？')) {
    memoryState = {};
    localStorage.removeItem(STORAGE_KEY + '_' + ROOM_ID);
    if (supabaseClient) supabaseClient.from('trip_states').upsert({ room_id: ROOM_ID, data: {}, updated_at: new Date().toISOString() });
    location.reload();
  }
});

async function initApp() {
  await initSync();
  renderCheckSection('section-booking', 'booking', DATA.booking);
  renderCheckSection('section-clothes', 'clothes', DATA.clothes);
  renderCheckSection('section-daily', 'daily', DATA.daily);
  renderCheckSection('section-amenities', 'amenities', DATA.amenities);
  renderCheckSection('section-prep', 'prep', DATA.prep);
  renderCheckSection('section-shopping', 'shopping', DATA.shopping);
  renderCheckSection('section-gift', 'gift', DATA.gift);
  renderCheckSection('section-luggage', 'luggage', DATA.luggage);
  renderCheckSection('section-memo', 'memo', DATA.memo);
  renderAllDays();
  updateProgress();
}

initApp();
